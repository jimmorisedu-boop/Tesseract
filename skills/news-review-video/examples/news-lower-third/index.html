<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* no background anywhere: the frame must stay transparent for an alpha overlay */
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        color: #f5f5f4;
      }
      /* ink plate, one step off pure black; no glow, no glass, no gradient */
      #plate {
        position: absolute;
        left: 96px;
        bottom: 132px;
        display: flex;
        align-items: stretch;
        background: #0b0b0c;
        transform-origin: left center;
      }
      #tick { width: 10px; background: #e8402a; }
      #text { padding: 26px 40px 28px 32px; }
      #name {
        font-size: 64px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.3;
        padding-bottom: 6px;
        overflow: hidden;
      }
      #name span { display: inline-block; }
      #role {
        margin-top: 10px;
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: #a8a29e;
      }
      #stat {
        position: absolute;
        right: 96px;
        bottom: 132px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #stat .num {
        font-size: 132px;
        font-weight: 680;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #e8402a;
      }
      #stat .cap {
        margin-top: 8px;
        font-size: 28px;
        color: #f5f5f4;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="plate" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="tick"></div>
        <div id="text">
          <div id="name"><span>Марина Ковалёва</span></div>
          <div id="role">политолог, автор телеграм-канала</div>
        </div>
      </div>
      <div id="stat" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="num"><span id="num">0</span><span>%</span></div>
        <div class="cap">опрошенных ждут отставки</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // entrance: expo-out, no overshoot; the plate opens from its left edge
      tl.fromTo("#plate", { scaleX: 0.72, x: -28, opacity: 0 },
        { scaleX: 1, x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
      // the name slides up out of a clipped line, the accent tick arrives first
      tl.fromTo("#name span", { yPercent: 108, opacity: 0.4 },
        { yPercent: 0, opacity: 1, duration: 0.52, ease: "expo.out" }, 0.08);
      tl.fromTo("#tick", { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: "expo.out" }, 0);
      tl.fromTo("#role", { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.26);
      // stat: count-up on an eased curve, tabular figures, then a read hold
      const counter = { v: 0 };
      tl.to(counter, {
        v: 62, duration: 0.9, ease: "expo.out",
        onUpdate: () => { document.getElementById("num").textContent = Math.round(counter.v); },
      }, 0.2);
      tl.fromTo("#stat", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.2);
      // drift instead of freezing (hold stays alive)
      tl.fromTo("#root", { scale: 1 }, { scale: 1.012, duration: 3, ease: "none" }, 0);
      // exit: ease-in, faster than the entrance, out of frame before the end
      tl.to("#plate", { x: -60, opacity: 0, duration: 0.3, ease: "power3.in" }, 2.62);
      tl.to("#stat", { opacity: 0, y: -14, duration: 0.26, ease: "power3.in" }, 2.64);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
